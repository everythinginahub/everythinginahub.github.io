  <text x="158" y="100" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#263944">Everything Hub</text>
  <text x="84" y="191" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.3" fill="#8b624e">A STUDY &amp; EVERYDAY WORKSPACE</text>
  <text x="80" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#263944">Study, plan,</text>
  <text x="80" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#263944">make room for life.</text>
  <text x="84" y="416" font-family="Arial, sans-serif" font-size="21" fill="#5d6c70">One useful place for schoolwork and everyday life.</text>
  <text x="84" y="472" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#567081">FLASHCARDS  ·  TASKS  ·  NOTES  ·  TIMETABLES</text>
  <text x="84" y="501" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#567081">HABITS  ·  BOOKS  ·  GAMES  ·  USEFUL TOOLS</text>

