  <rect x="770" y="362" width="36" height="36" rx="9" fill="#e9e8f5"/>
  <path d="M778 372h15a3 3 0 0 1 3 3v14h-15a3 3 0 0 1-3-3zm3-4h12a3 3 0 0 1 3 3" fill="none" stroke="#5d5f8d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="823" y="375" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#31434b">Learn</text>
  <text x="823" y="394" font-family="Arial, sans-serif" font-size="12" fill="#71807d">Flashcards, quizzes &amp; books</text>
  <path d="m1055 374 6 6-6 6" fill="none" stroke="#84938e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

