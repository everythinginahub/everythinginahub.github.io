  </g>
  <text x="758" y="211" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8b624e">START WITH WHAT YOU NEED</text>
  <text x="758" y="247" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#263944">A little of everything.</text>

