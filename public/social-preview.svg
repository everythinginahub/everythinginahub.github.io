  <rect x="770" y="436" width="36" height="36" rx="9" fill="#f6e9d9"/>
  <path d="M788 444v15m-7.5-7.5h15m-13 10h11" fill="none" stroke="#98633d" stroke-width="1.8" stroke-linecap="round"/>
  <text x="823" y="449" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#31434b">Take a break</text>
  <text x="823" y="468" font-family="Arial, sans-serif" font-size="12" fill="#71807d">Puzzles, games &amp; tools</text>
  <path d="m1055 448 6 6-6 6" fill="none" stroke="#84938e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

