  <text x="84" y="583" font-family="Arial, sans-serif" font-size="13" fill="#74827f">A calm, flexible hub. Pick up where you left off—or just do one thing.</text>
  <text x="1116" y="583" text-anchor="end" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#496878">EVERYTHING HUB</text>
