<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Everything Hub — study, plan and make room for life</title>
  <desc id="description">A study and everyday workspace for flashcards, tasks, notes, habits, books, games and useful tools.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6456e8"/>
      <stop offset="1" stop-color="#168c9c"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6f0"/>
      <stop offset="1" stop-color="#e8eeea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#253b48" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#wash)"/>
  <circle cx="1135" cy="42" r="250" fill="#e1eae4" opacity=".72"/>
  <circle cx="20" cy="640" r="210" fill="#e9dfd2" opacity=".55"/>

  <rect x="82" y="62" width="58" height="58" rx="17" fill="url(#brand)"/>
  <path d="M97 79h28M97 91h20M97 103h25" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="123" cy="91" r="3.2" fill="#65e3cc"/>
